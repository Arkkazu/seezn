name: Prepare protected burger local transfer
on:
  push:
    branches: [deploy/burger-preview-20261003]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seal connection information for the authorized local deployment
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const names=['FTP_SERVER','FTP_USERNAME','FTP_PASSWORD','FTP_REMOTE_PATH'];
          const payload=JSON.stringify(Object.fromEntries(names.map(n=>[n,process.env[n]])));
          const key=crypto.randomBytes(32),iv=crypto.randomBytes(12),c=crypto.createCipheriv('aes-256-gcm',key,iv);
          const encrypted=Buffer.concat([c.update(payload),c.final()]);
          const recipient=fs.readFileSync('deployment/burger-preview/credential-recipient.pem');
          const wrapped=crypto.publicEncrypt({key:recipient,oaepHash:'sha256'},key);
          fs.writeFileSync('/tmp/burger-connection.sealed.json',JSON.stringify({key:wrapped.toString('base64'),iv:iv.toString('base64'),tag:c.getAuthTag().toString('base64'),data:encrypted.toString('base64')}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-burger-connection
          path: /tmp/burger-connection.sealed.json
          retention-days: 1
